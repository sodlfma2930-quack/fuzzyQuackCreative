name: Daily Tech Blog Post

on:
  schedule:
    - cron: '3 0 * * *' # UTC 00:03 = KST 09:03
  workflow_dispatch: # 수동 실행 가능

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install anthropic

      - name: Generate and commit blog post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/auto-blog-post.py

      - name: Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add writable/data/posts.json docs/blog/
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Add daily tech blog post [auto]"
          git push
